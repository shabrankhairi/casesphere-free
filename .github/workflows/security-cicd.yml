name: Case Sphere Security CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:

  # ── 1. Secret scanning ─────────────────────────────────────
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. Dependency vulnerability scan ───────────────────────
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend deps
        run: npm install

      - name: NPM Audit backend
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Install frontend deps
        run: cd frontend && npm install

      - name: NPM Audit frontend
        run: cd frontend && npm audit --audit-level=high
        continue-on-error: false

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'casesphere'
          path: '.'
          format: 'HTML'
          args: >
            --enableRetired
            --enableExperimental

      - name: Upload dependency check report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/

  # ── 3. SAST - Static Application Security Testing ──────────
  sast:
    name: SAST Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/nodejs
            p/jwt
            p/sql-injection
            p/xss
            p/secrets
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"

  # ── 4. Docker image security scan ──────────────────────────
  docker-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest
    needs: [secret-scan, dependency-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t casesphere:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'casesphere:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Grype for additional CVE scan
        uses: anchore/scan-action@v3
        with:
          image: 'casesphere:${{ github.sha }}'
          fail-build: true
          severity-cutoff: high

  # ── 5. DAST - Dynamic Application Security Testing ─────────
  dast:
    name: DAST Scan
    runs-on: ubuntu-latest
    needs: [docker-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Start application
        run: |
          cp .env.example .env
          sed -i 's/GANTI_PASSWORD_KUAT_DISINI/TestPassword123!/' .env
          sed -i 's/GENERATE_RANDOM_64_CHAR/abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890/' .env
          docker compose up -d postgres
          sleep 15
          docker compose up -d app
          sleep 20

      - name: Wait for app ready
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:3000/api/health; do sleep 2; done'

      - name: ZAP OWASP Security Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_html.html

      - name: Stop application
        if: always()
        run: docker compose down

  # ── 6. Build and push (only on main) ───────────────────────
  build-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: [sast, docker-scan, dast]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

  # ── 7. Deploy to production ─────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-push]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /home/dbmadmin/casesphere
            
            # Pull latest image
            docker pull ghcr.io/${{ github.repository }}:latest
            
            # Rolling restart — zero downtime
            docker compose pull
            docker compose up -d --no-deps app
            
            # Health check
            sleep 15
            curl -sf http://localhost:3000/api/health || exit 1
            
            echo "Deploy successful!"

  # ── 8. Security report notification ─────────────────────────
  notify:
    name: Security Report
    runs-on: ubuntu-latest
    needs: [secret-scan, dependency-scan, sast, docker-scan]
    if: always()
    steps:
      - name: Notify on failure
        if: contains(needs.*.result, 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: '🚨 Security scan failed - ' + context.sha.slice(0,7),
              body:  '## Security CI/CD Failed\n\nCommit: ' + context.sha + '\nBranch: ' + context.ref + '\n\nPlease check the Actions tab for details.',
              labels: ['security', 'ci-failure']
            })
